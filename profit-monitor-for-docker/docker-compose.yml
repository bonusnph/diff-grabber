version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: profit-monitor-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-profit_monitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - profit-monitor-network

  profit-monitor:
    # Pulled from Docker Hub — build the image locally with `yarn docker:release`
    # and push it, don't build on the server (no Dockerfile/source there).
    image: bonusnph/profit-monitor:latest
    container_name: profit-monitor-app
    ports:
      # Host port 3300 avoids the existing 80 / 8080 / 3306 containers on this server.
      # Change "3300" on the left if you need a different host port.
      - "3300:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-profit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-profit_monitor}
      - SETTINGS_SEED_PATH=/app/settings-seed.json
      - ACCOUNTS_SEED_PATH=/app/accounts-seed.json
    env_file:
      - .env
    volumes:
      - ./settings-seed.json:/app/settings-seed.json:ro
      - ./accounts-seed.json:/app/accounts-seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - profit-monitor-network

  # Cloudflare Tunnel: exposes the app to your domain without opening any port
  # on the host. Create the tunnel in the Cloudflare Zero Trust dashboard
  # (Networks > Tunnels), copy its token into CLOUDFLARE_TUNNEL_TOKEN in .env,
  # and set the tunnel's public hostname to point at service "profit-monitor",
  # port 3000 (the internal docker network address, not localhost:3300).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: profit-monitor-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - profit-monitor
    networks:
      - profit-monitor-network

volumes:
  postgres-data:

networks:
  profit-monitor-network:
    driver: bridge
