services:
  postgres:
    image: postgres:16-alpine
    container_name: profit-monitor-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-profit_monitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - profit-monitor-network

  profit-monitor:
    build: .
    image: bonusnph/profit-monitor:latest
    container_name: profit-monitor-app
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:-https://profit.sumofx.co}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: host
      DATABASE_URL: postgresql://${POSTGRES_USER:-profit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-profit_monitor}
      SETTINGS_SEED_PATH: /app/settings-seed.json
      ACCOUNTS_SEED_PATH: /app/accounts-seed.json
    env_file:
      - .env
    volumes:
      - ./settings-seed.json:/app/settings-seed.json:ro
      - ./accounts-seed.json:/app/accounts-seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - profit-monitor-network

  caddy:
    image: caddy:2-alpine
    container_name: profit-monitor-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - profit-monitor
    restart: unless-stopped
    networks:
      - profit-monitor-network
      - wordpress

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  profit-monitor-network:
    driver: bridge
  wordpress:
    external: true
    name: docker_wpsite
