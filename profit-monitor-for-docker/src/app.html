<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
		%sveltekit.head%
		<script>
			(function () {
				var SHORT = 466;
				var LONG = 678;

				function segmentsAxis() {
					try {
						if (window.matchMedia('(horizontal-viewport-segments: 2)').matches) return 'h';
						if (window.matchMedia('(vertical-viewport-segments: 2)').matches) return 'v';
					} catch (e) {}
					var segs = window.viewport && window.viewport.segments;
					if (!segs || segs.length < 2) return '';
					var a = segs[0];
					var b = segs[1];
					if (b.x > a.x + 8) return 'h';
					if (b.y > a.y + 8) return 'v';
					return '';
				}

				function screenBox() {
					var dpr = window.devicePixelRatio || 1;
					var sw = Math.min(screen.width, screen.height);
					var sh = Math.max(screen.width, screen.height);
					if (dpr > 1 && (sw > 900 || sh > 1200)) {
						sw = sw / dpr;
						sh = sh / dpr;
					}
					return { sw: sw, sh: sh };
				}

				function isDuo() {
					var box = screenBox();
					if (Math.abs(box.sw - SHORT) <= 8 && Math.abs(box.sh - LONG) <= 10) return true;
					var ua = navigator.userAgent || '';
					if (/iPhone Duo/i.test(ua)) return true;
					if (!/iPhone/.test(ua)) return false;
					var w = window.innerWidth;
					var h = window.innerHeight;
					if (w >= 360 && w <= 430 && h >= 540 && h <= 640) return true;
					if (w >= 540 && w <= 660 && h >= 330 && h <= 450) return true;
					if (w >= 620 && w <= 760 && h >= 760 && h <= 980) return true;
					if (w >= 830 && w <= 1000 && h >= 500 && h <= 720) return true;
					return false;
				}

				function viewportBox() {
					var w = window.innerWidth;
					var h = window.innerHeight;
					var view = window.visualViewport;
					if (view) {
						if (view.width) w = Math.min(w, Math.round(view.width));
						if (view.height) h = Math.min(h, Math.round(view.height));
					}
					return { w: w, h: h };
				}

				function pose() {
					var box = viewportBox();
					var w = box.w;
					var h = box.h;
					var duo = isDuo();
					var axis = segmentsAxis();
					var shortLandscape = w >= 480 && h <= 540 && w > h;
					// Cover landscape is short. A hinge segment must not reclassify it as the open screen.
					if (shortLandscape && (duo || axis === 'h')) return 'folded-landscape';
					if (axis === 'h') return 'open-landscape';
					if (axis === 'v') return 'open-portrait';
					if (!duo) return '';
					if (w < 200 || h < 200) return '';
					if (w >= 800 && h <= 780) return 'open-landscape';
					if (w >= 800 && w > h) return 'open-landscape';
					if (w >= 600 && h >= 680) return 'open-portrait';
					return 'folded-portrait';
				}

				function apply() {
					var next = pose();
					var root = document.documentElement;
					if (next) root.setAttribute('data-duo', next);
					else root.removeAttribute('data-duo');
				}

				apply();
				window.addEventListener('resize', apply);
				window.addEventListener('orientationchange', apply);
				window.addEventListener('pageshow', apply);
				if (window.visualViewport) window.visualViewport.addEventListener('resize', apply);
				if (navigator.devicePosture && navigator.devicePosture.addEventListener) {
					navigator.devicePosture.addEventListener('change', apply);
				}
				['(horizontal-viewport-segments: 2)', '(vertical-viewport-segments: 2)', '(device-posture: folded)'].forEach(function (q) {
					try {
						var media = window.matchMedia(q);
						if (media.addEventListener) media.addEventListener('change', apply);
					} catch (e) {}
				});
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
