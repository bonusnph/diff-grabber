version: '3.8'

services:
  profit-monitor:
    build: .
    container_name: profit-monitor-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - profit-monitor-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: profit-monitor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - profit-monitor
    restart: unless-stopped
    networks:
      - profit-monitor-network
    profiles:
      - production

networks:
  profit-monitor-network:
    driver: bridge
